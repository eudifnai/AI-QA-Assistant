[package]
name = "ai-qa-assistant"
version = "0.1.0"
description = "Local-first AI QA Assistant desktop application"
authors = ["AI QA Assistant contributors"]
edition = "2021"

[lib]
name = "ai_qa_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

