name: Quality

on:
  push:
    branches: [main, "codex/release-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: Release gate strictness
        required: true
        default: internal
        type: choice
        options:
          - internal
          - formal
      previous_run_id:
        description: Previous release-candidate run id for upgrade acceptance
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy backend
      - run: uv run pytest -q
      - run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high

  desktop:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-groups
      - run: pnpm installer:test
      - name: Validate previous candidate input
        if: github.event_name == 'workflow_dispatch' && inputs.previous_run_id != ''
        shell: pwsh
        env:
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
        run: |
          if ($env:PREVIOUS_RUN_ID -notmatch "^[1-9][0-9]*$") {
            throw "Previous workflow run id must be a positive integer."
          }
      - name: Download previous Windows candidate
        if: github.event_name == 'workflow_dispatch' && inputs.previous_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: windows-release-candidate-${{ inputs.previous_run_id }}
          path: ${{ runner.temp }}/ai-qa-previous-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.previous_run_id }}
      - name: Validate Azure Artifact Signing configuration
        if: github.event_name == 'workflow_dispatch' && inputs.release_gate == 'formal'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AI_QA_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AI_QA_ARTIFACT_SIGNING_ENDPOINT }}
          AI_QA_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AI_QA_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AI_QA_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AI_QA_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AI_QA_ARTIFACT_SIGNING_ENDPOINT",
            "AI_QA_ARTIFACT_SIGNING_ACCOUNT_NAME",
            "AI_QA_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME"
          )
          $missing = @(
            $required | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
            }
          )
          if ($missing.Count -gt 0) {
            throw "Formal release gate requires all Azure Artifact Signing variables. Missing: $($missing -join ', ')."
          }
          $endpoint = [uri]$env:AI_QA_ARTIFACT_SIGNING_ENDPOINT
          if (-not $endpoint.IsAbsoluteUri -or $endpoint.Scheme -ne "https") {
            throw "AI_QA_ARTIFACT_SIGNING_ENDPOINT must be an absolute HTTPS URL."
          }
      - name: Make unsigned internal candidate
        if: github.event_name != 'workflow_dispatch' || inputs.release_gate != 'formal'
        run: pnpm electron:make
      - name: Package application for formal signing
        if: github.event_name == 'workflow_dispatch' && inputs.release_gate == 'formal'
        run: pnpm electron:package
      - name: Azure login for formal signing
        if: github.event_name == 'workflow_dispatch' && inputs.release_gate == 'formal'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign packaged application with Azure Artifact Signing
        if: github.event_name == 'workflow_dispatch' && inputs.release_gate == 'formal'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AI_QA_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AI_QA_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AI_QA_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\frontend\out\AI QA Assistant-win32-x64
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          batch-size: 10000
      - name: Make formally signed Squirrel artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.release_gate == 'formal'
        run: pnpm electron:make:from-package
        env:
          AI_QA_WINDOWS_SIGN_MODE: "artifact_signing"
          AI_QA_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AI_QA_ARTIFACT_SIGNING_ENDPOINT }}
          AI_QA_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AI_QA_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AI_QA_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AI_QA_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      - name: Validate installer artifacts
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/windows-release/Invoke-InstallerAcceptance.ps1
          -Mode Validate
          -EvidenceDirectory "$env:RUNNER_TEMP/ai-qa-installer-acceptance"
      - name: Enforce formal release signing
        if: github.event_name == 'workflow_dispatch' && inputs.release_gate == 'formal'
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/windows-release/Invoke-InstallerAcceptance.ps1
          -Mode Validate
          -RequireSignedArtifacts
          -EvidenceDirectory "$env:RUNNER_TEMP/ai-qa-installer-acceptance-formal"
      - name: Exercise install, first launch, and uninstall
        if: github.event_name != 'workflow_dispatch' || inputs.previous_run_id == ''
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/windows-release/Invoke-InstallerAcceptance.ps1
          -Mode Lifecycle
          -AllowSystemChanges
          -EvidenceDirectory "$env:RUNNER_TEMP/ai-qa-installer-acceptance"
      - name: Exercise upgrade, first launch, and uninstall
        if: github.event_name == 'workflow_dispatch' && inputs.previous_run_id != ''
        shell: pwsh
        run: >
          pwsh -NoProfile -File scripts/windows-release/Invoke-InstallerAcceptance.ps1
          -Mode Lifecycle
          -PreviousArtifactRoot "$env:RUNNER_TEMP/ai-qa-previous-candidate"
          -AllowSystemChanges
          -EvidenceDirectory "$env:RUNNER_TEMP/ai-qa-installer-acceptance"
      - name: Archive Windows release candidate
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate-${{ github.run_id }}
          path: |
            frontend/out/make/squirrel.windows/x64/AI-QA-Assistant-Setup.exe
            frontend/out/make/squirrel.windows/x64/AIQAAssistant-*-full.nupkg
            frontend/out/make/squirrel.windows/x64/RELEASES
            frontend/out/make/ai-qa-assistant.cdx.json
            frontend/out/make/RELEASE-METADATA.json
            frontend/out/make/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
